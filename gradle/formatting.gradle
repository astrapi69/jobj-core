spotless {

    format "misc", {
        // define the files to apply `misc` to
        target "*.gradle", "*.md", ".gitignore"

        // define the steps to apply to those files
        trimTrailingWhitespace()
        leadingTabsToSpaces() // or spaces. Takes an integer argument if you don"t like 4
        endWithNewline()
    }
    java {
        // export config file:
        // https://github.com/diffplug/spotless/blob/main/ECLIPSE_SCREENSHOTS.md#creating-spotlessimportorder
        importOrderFile('src/test/resources/spotless/importorder.properties')
        // removes any unused imports
        removeUnusedImports()
        // import order file as exported from eclipse
        eclipse("4.21").configFile("src/test/resources/spotless/alpharo-formatter.xml")
        // Enforces the MIT header, in place of the com.github.hierynomus.license plugin: its last release, 0.16.1,
        // reads Task.project at execution time, which Gradle 10 removes (as in astrapi69/file-worker), and this build
        // had turned its checks off (ignoreFailures, licenseMain and licenseTest excluded). The header is the one 51
        // of the 57 Java files carry; Spotless leaves package-info.java and module-info.java as they are. The file
        // lies outside src/main/resources, so it is not packed into the jar.
        licenseHeaderFile(rootProject.file("gradle/license-header.txt"))
    }
}
