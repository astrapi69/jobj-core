// cglib 3.3.0, the test dependency that makes the proxies ClassExtensionsTest detects, defines its classes through
// ClassLoader.defineClass by reflection, which Java 17 and later refuse unless java.lang is opened to it: without
// this, Enhancer.create fails with an ExceptionInInitializerError, and the three proxy tests were disabled. The
// minions of PIT take the same argument (gradle/mutation-testing.gradle). The main code needs nothing of it.
ext.cglibTestJvmArgs = ["--add-opens", "java.base/java.lang=ALL-UNNAMED"]

test {
    useJUnitPlatform()
    jvmArgs cglibTestJvmArgs
}

// The JaCoCo version Gradle 9.8.2 brings, named so that a Gradle update does not change the measurement
// unnoticed (as astrapi69/silly-collection)
jacoco {
    toolVersion = '0.8.15'
}

jacocoTestReport {
    reports {
        xml.required.set(true)
        html.required.set(true)
    }
}

// Coverage floor the build fails below (RL-112): each measure minus about two points, rounded down, as in
// astrapi69/silly-collection#38 and astrapi69/file-worker#38, so that a few lines or branches that a new method's
// tests do not reach yet do not fail the build at once, and a drop of more than about two points does. Set at 0.84
// and 0.59 from develop db55754 (574 of 660 lines, 274 of 446 branches); raised after the parameterized tests of
// milestone 10.0 (the maintainer, 2026-11-14), measured on develop d36dcf5 with ./gradlew clean build
// --no-build-cache: 695 of 731 lines (95.08 %), 400 of 466 branches (85.84 %).
jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.93
            }
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.83
            }
        }
    }
}

jacocoTestCoverageVerification.dependsOn test
check.dependsOn jacocoTestReport
check.dependsOn jacocoTestCoverageVerification
